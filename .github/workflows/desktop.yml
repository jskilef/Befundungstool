# Desktop app for Windows, macOS and Linux: each package has to be built on its own operating system.
# Every job runs the engine and desktop checks (synthetic data, stub providers, no real AI calls), then
# builds that system's packages. The last job collects them into one release folder with SHA256SUMS.txt.
# Nothing is published: the result is a workflow artifact.
name: Desktop app

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'desktop-*']
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
          - { name: Linux, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download the Electron binary
        run: npm run desktop:setup
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox uses; the installed .deb
      # ships an AppArmor profile instead, but the unpacked test binary has none.
      - name: Allow the Chromium sandbox (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Engine checks
        run: node scripts/test.cjs engine
      - name: Desktop checks
        if: runner.os != 'Linux'
        run: node scripts/test.cjs desktop
      - name: Desktop checks (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/test.cjs desktop
      - name: Build packages
        run: node scripts/release.cjs --desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/release/befundungstool-v*-windows-*
            dist/release/befundungstool-v*-macos-*
            dist/release/befundungstool-v*-linux-*

  release:
    name: Release folder
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ZIP and standalone HTML
        run: node scripts/release.cjs
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist/release
      - name: Checksums for every file
        working-directory: dist/release
        run: |
          rm -f SHA256SUMS.txt
          sha256sum -- * > SHA256SUMS.txt.new
          mv SHA256SUMS.txt.new SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: befundungstool-release
          path: dist/release
          if-no-files-found: error
